<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>광고 재노출 인식 설문</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 한 화면에 한 단계. 자극 화면은 데스크톱에서 왼쪽 고정, 모바일에서는 상단 + 확대 보기 */
:root {
  --bg: #f4f4f4;
  --surface: #ffffff;
  --fg: #171717;
  --muted: #6b6b6b;
  --line: #e0e0e0;
  --accent: #1d3fd0;
  --accent-ink: #ffffff;
  --accent-soft: #eef1fc;
  --warn: #c0262d;
  --warn-soft: #fdeeee;
  --ok: #1d3fd0;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121212; --surface: #1c1c1c; --fg: #ededed; --muted: #a3a3a3; --line: #333333;
  --accent: #7d95ff; --accent-ink: #0b0f22; --accent-soft: #1e2446;
  --warn: #f08a90; --warn-soft: #3a1d21; --ok: #7d95ff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1c1c1c; --fg: #ededed; --muted: #a3a3a3; --line: #333333;
  --accent: #7d95ff; --accent-ink: #0b0f22; --accent-soft: #1e2446;
  --warn: #f08a90; --warn-soft: #3a1d21; --ok: #7d95ff; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
body { margin: 0; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: anywhere; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.topbar-in { max-width: 1040px; margin: 0 auto; padding-block: 10px; display: flex; align-items: center; gap: 14px; }
.topbar .label { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }
.step-no { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; }
.wrap { max-width: 1040px; margin: 0 auto; }
.narrow { max-width: 620px; margin: 0 auto; }

.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--accent); }
.title { font-size: clamp(22px, 4.4vw, 28px); font-weight: 700; margin-top: 6px; }
.lead { color: var(--muted); margin-top: 10px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.stack { display: grid; gap: 18px; }

/* form */
.field { display: grid; gap: 8px; }
.field > label, .field > .flabel { font-weight: 600; font-size: 15px; }
input[type=text], input[type=number] { width: 100%; padding: 12px 14px; font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
input:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg-2 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 560px) { .seg-5 { grid-template-columns: repeat(5, 1fr); } }
.choice { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px 10px; cursor: pointer; text-align: center; font-weight: 500; transition: background .15s, border-color .15s; }
.choice[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.err { color: var(--warn); font-size: 14px; font-weight: 500; }

.btn-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 14px 26px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-ink); min-width: 140px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); min-width: 0; }

/* scenario */
.scenario { font-size: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.scenario p + p { margin-top: 2px; }
.scenario .scenario-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.intro { display: grid; gap: 12px; margin-top: 16px; font-size: 15px; color: var(--fg); }
.facts { margin: 4px 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.facts > div { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.facts dt { font-weight: 600; color: var(--muted); font-size: 14px; }
.facts dd { margin: 0; }
.question { font-size: 16px; font-weight: 600; text-wrap: pretty; }
.opt { font-size: 15px; }
.instruction { font-size: 16px; font-weight: 500; color: var(--fg); }
.scenario-phone { max-width: 300px; }

/* phone stimulus */
.phone { position: relative; width: 100%; max-width: 330px; margin: 0 auto; border-radius: 26px; overflow: hidden; border: 1px solid var(--line); background: #fff; box-shadow: 0 10px 30px rgba(10, 30, 50, .12); }
.phone img { display: block; width: 100%; height: auto; }
.cond-tag { position: absolute; left: 10px; top: 10px; }
.hotspot { position: absolute; left: 9%; top: 67.6%; width: 35%; height: 5.8%; border: 0; background: transparent; cursor: pointer; border-radius: 8px; padding: 0; }
.hotspot::after { content: ""; position: absolute; inset: -3px; border-radius: 10px; border: 2px solid #e8434a; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .hotspot::after { animation: none; opacity: .8; } .track > i { transition: none; } }
.close-spot { left: 74%; width: 17.5%; }
.hotspot[aria-checked="true"]::after { animation: none; opacity: 0; }
.check-mark { pointer-events: none; position: absolute; left: 13.6%; top: 69.75%; width: 3.4%; aspect-ratio: 1; background: #e8434a; border-radius: 2px; display: grid; place-items: center; }
.check-mark svg { width: 80%; height: 80%; }
.tap-hint { text-align: center; color: var(--muted); font-size: 14px; margin-top: 12px; }
.done-note { text-align: center; color: var(--ok); font-weight: 600; font-size: 15px; margin-top: 12px; }

.two-col { display: grid; gap: 28px; grid-template-columns: 1fr; }
.cond-head { max-width: 760px; margin-bottom: 24px; }
@media (min-width: 860px) {
  .two-col { grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
  .two-col .sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
  .two-col .phone { max-height: calc(100vh - 130px); width: auto; aspect-ratio: 402 / 944; }
  .two-col .phone img { height: 100%; object-fit: contain; }
}
@media (max-width: 859px) { .two-col .phone { max-width: 250px; } }
/* 조건 제시 전 안내 화면 */
.intro-stage { position: relative; min-height: min(76vh, 720px); display: grid; place-items: center; overflow: hidden; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); padding: 40px 20px; }
.intro-stage .bg { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; pointer-events: none; }
.intro-stage .bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, var(--surface) 0%, transparent 70%); opacity: .75; }
.intro-copy { position: relative; max-width: 520px; text-align: center; display: grid; gap: 18px; }
.intro-copy .intro-head { font-size: clamp(22px, 4.6vw, 30px); font-weight: 700; line-height: 1.35; text-wrap: balance; }
.intro-copy .intro-body { display: grid; gap: 10px; font-size: clamp(16px, 2.6vw, 18px); line-height: 1.7; text-wrap: pretty; }
.intro-copy .intro-body b { color: var(--accent); font-weight: 600; }
.intro-copy .btn-row { justify-content: center; margin-top: 10px; }
/* 거부 장면 재생: 체크 → 닫기 → 흐려지며 안내 문구 */
.intro-stage .bg { padding-block: 22px; }
.anim-phone { position: relative; height: 100%; aspect-ratio: 402 / 944; border-radius: 30px; overflow: hidden; background: #fff; box-shadow: 0 10px 30px rgba(10, 30, 50, .14); transition: opacity .9s ease, filter .9s ease, box-shadow .9s ease; }
.anim-phone img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
.anim-phone .anim-popup { transition: opacity .4s ease; }
.anim-phone .anim-popup.off { opacity: 0; }
.anim-box { position: absolute; left: 9%; top: 67.6%; width: 35%; height: 5.8%; border: 2.5px solid #e8434a; border-radius: 8px; box-shadow: 0 0 0 4px rgba(232, 67, 74, .2); opacity: 0; transition: left .5s ease, width .5s ease, opacity .3s ease, transform .15s ease; }
.anim-box.on { opacity: 1; }
.anim-box.at-close { left: 74%; width: 17.5%; }
.anim-box.tap { transform: scale(.92); }
.intro-stage .bg::after { transition: opacity .9s ease; }
.intro-stage.playing .bg::after { opacity: 0; }
.intro-stage.settled .anim-phone { opacity: .14; filter: blur(1.5px) grayscale(.2); box-shadow: none; }
.intro-copy { transition: opacity .6s ease .25s; }
.intro-stage.playing .intro-copy { opacity: 0; visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .anim-phone, .anim-box, .intro-copy, .intro-stage .bg::after { transition: none; } }
.expect-block { border-top: 2px solid var(--fg); padding-top: 20px; margin-top: 8px; }
.base-btn { display: none; }
@media (min-width: 860px) {
  .two-col .zoom-btn { display: none; }
  .base-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px; padding: 13px 16px; border-radius: 12px; border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 15px; cursor: pointer; transition: background .15s, color .15s; }
  .base-btn svg { width: 18px; height: 18px; flex: none; }
  .base-btn:hover { background: var(--accent); color: var(--accent-ink); }
  .fab.fab-mobile { display: none; }
}
.checks { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.check { display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; cursor: pointer; font-size: 15px; }
.check .box { flex: none; width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--line); display: grid; place-items: center; }
.check[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.check[aria-checked="true"] .box { border-color: var(--accent); background: var(--accent); }
.check[aria-checked="true"] .box::after { content: ""; width: 10px; height: 6px; border: solid var(--accent-ink); border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
.group.missing .checks .check { border-color: var(--warn); }
.reveal { animation: reveal .35s ease; }
@keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
.zoom-btn { display: block; margin: 10px auto 0; background: transparent; border: 0; color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; }

/* P options */
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
.opt .dot { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-checked="true"] .dot { border-color: var(--accent); }
.opt[aria-checked="true"] .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

/* likert */
.scale-key { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.groups { display: grid; gap: 28px; }
.group { display: grid; gap: 12px; }
.group-head { display: grid; gap: 4px; padding-top: 4px; border-top: 2px solid var(--fg); padding-block: 12px 2px; }
.group-no { font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--accent); }
.group-q { font-size: 18px; font-weight: 700; }
.items { display: grid; gap: 12px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
.item.missing { border-color: var(--warn); background: var(--warn-soft); }
.item .q { font-weight: 500; }
.item .q b { font-family: var(--font-mono); font-weight: 500; color: var(--accent); font-size: 13px; margin-right: 8px; }
.likert { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.likert button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; min-height: 44px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; padding: 0; }
.likert button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* rank */
.rank-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; margin-top: 4px; }
@media (min-width: 860px) { .rank-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; } }
.rank-item { display: grid; gap: 6px; justify-items: center; }
.rank-card { position: relative; display: block; width: 100%; max-width: 210px; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 18px; }
.rank-card .phone { max-width: none; border-radius: 16px; box-shadow: none; transition: outline-color .15s; outline: 3px solid transparent; outline-offset: 3px; }
.rank-card[aria-pressed="true"] .phone { outline-color: var(--accent); }
.rank-badge { position: absolute; left: 8px; top: 8px; width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.rank-name { font-size: 20px; font-weight: 600; color: var(--accent); text-align: center; line-height: 1.2; margin-top: 4px; }
.rank-scale { margin-top: 6px; font-weight: 600; font-size: 15px; }
.rank-slots { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 41px); z-index: 10; background: var(--bg); display: flex; align-items: center; justify-content: center; gap: 8px; padding-block: 10px; margin-top: -12px; }
.slot { width: 56px; height: 56px; border-radius: 10px; background: var(--line); color: var(--muted); display: grid; place-items: center; font-size: 15px; font-weight: 500; border: 0; padding: 0; }
.slot.filled { background: var(--surface); border: 2px solid var(--accent); color: var(--accent); font-size: 24px; font-weight: 700; cursor: pointer; }
.slot-arrow { color: var(--muted); font-size: 16px; }
.rank-help { text-align: center; margin: 2px 0 14px; }
.rank-zoom { background: transparent; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 2px 6px; }

/* lightbox */
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(5, 10, 15, .82); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lightbox img { max-height: calc(100vh - 90px); max-width: 100%; width: auto; border-radius: 22px; }
.lightbox .close { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: max(16px, env(safe-area-inset-top, 0px)); background: #fff; color: #111; border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
.fab { position: fixed; z-index: 40; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; }
.fab { transition: opacity .2s, transform .2s; }
.fab.fab-hide { opacity: 0; transform: translateY(12px); pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .fab { transition: none; } }

/* done / results */
.code { font-family: var(--font-mono); font-size: 14px; background: var(--bg); border: 1px dashed var(--line); padding: 10px 12px; border-radius: 8px; word-break: break-all; }
.status { font-weight: 600; }
.status.ok { color: var(--ok); }
.status.bad { color: var(--warn); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
th { background: var(--bg); position: sticky; top: 0; }
.muted { color: var(--muted); font-size: 14px; }
</style>

<header class="topbar">
  <div class="topbar-in">
    <span class="label" id="stepLabel">참가자 정보</span>
    <div class="track" aria-hidden="true"><i id="bar"></i></div>
    <span class="step-no" id="stepNo">1 / 7</span>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<div class="lightbox" id="lightbox" hidden>
  <button class="close" id="lbClose" type="button">닫기</button>
  <img id="lbImg" alt="">

<script>
(() => {
  // ---------- 설정 ----------
  // ▼ 구글 시트로 응답을 받으려면 Apps Script 웹 앱 URL(https://script.google.com/macros/s/.../exec)을 따옴표 안에 넣으세요.
  const SUBMIT_URL = "https://script.google.com/macros/s/AKfycby4ap8I0HRzTUL6oiK7qtLPgNKCUD8AxAwLltuE86LqSoFPLTTjUm3KOAuUq4N_8HAf/exec";

  // 집단별 제시 순서. 링크 끝에 ?g=1 ~ ?g=4 를 붙여 배포합니다 (아티팩트에서는 #g1 ~ #g4).
  const GROUP_ORDERS = { 1: "ABCD", 2: "BDAC", 3: "DCBA", 4: "CADB" };
  const GROUP = (() => {
    let g = null;
    try { g = new URLSearchParams(location.search).get("g"); } catch {}
    if (!g) { const m = location.hash.match(/^#g([1-4])$/); if (m) g = m[1]; }
    return GROUP_ORDERS[g] ? Number(g) : 1;
  })();
  const ORDER = GROUP_ORDERS[GROUP].split("");
  const IMG = { base: "base.jpg", home: "home.jpg", A: "A.jpg?v=2", B: "B.jpg", C: "C.jpg", D: "D.jpg?v=2" };
  const COND = {
    A: "동일 광고 · 팝업", B: "동일 광고 · 고정 배너",
    C: "다른 광고 · 팝업", D: "다른 광고 · 고정 배너"
  };
  const P_OPTS = [
    ["P1", "처음 본 광고가 팝업 형태로만 다시 나타나지 않는 것"],
    ["P2", "처음 본 광고가 어떤 형태로도 다시 나타나지 않는 것"],
    ["P3", "광고 내용과 관계없이 모든 팝업 광고가 나타나지 않는 것"],
    ["P4", "광고 내용과 형태에 관계없이 모든 인앱 광고가 나타나지 않는 것"]
  ];
  const ITEMS = [
    ["V1", "이 광고 노출은 이전에 표시한 나의 거부 의사가 무시되었다고 느껴진다."],

  // 응답 데이터의 소요 시간 열 (구글 시트 열 순서 유지를 위해 고정). expect = 팝업을 닫은 뒤 사전 기대 문항에 응답한 시간

  function flatten(r) {
    const row = {
      response_id: r.id, group: r.group ?? "", order: r.order, started_at: r.startedAt, submitted_at: r.submittedAt,
      gender: r.info.gender, age: r.info.age,
      tapped_7day: r.tapped ? 1 : 0, P_expect: r.P,
      rank_order: (r.rank || []).join("")
    };
    for (const c of ["A", "B", "C", "D"]) {
      const a = (r.answers && r.answers[c]) || {};
      row[c + "_pos"] = r.order ? String(r.order).indexOf(c) + 1 : "";
      row[c + "_rank"] = r.rank && r.rank.includes(c) ? r.rank.indexOf(c) + 1 : "";
      for (const [k] of ITEMS) row[c + "_" + k] = a[k] ?? "";
      row[c + "_AC3_R"] = a.AC3 ? 8 - a.AC3 : "";

    row.ad_habit = (r.info && r.info.habit) || "";
    for (const c of ["A", "B", "C", "D"]) {
      const mc = (r.answers && r.answers[c] && r.answers[c].MC) || null;
      for (const [k] of MC_OPTS) row[c + "_MC_" + k] = mc ? (mc.includes(k) ? 1 : 0) : "";
    }
    row.survey_ver = r.ver || "";
    return row;
  }
  function toCSV(rows) {
    if (!rows.length) return "";
    const cols = Object.keys(flatten(rows[0]));
    const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return "﻿" + [cols.join(","), ...rows.map(r => { const f = flatten(r); return cols.map(c => q(f[c])).join(","); })].join("\n");
  }

  // ---------- 진행 표시 ----------
  const LABELS = { info: "참가자 정보", scenario: "상황 안내", rank: "순서 정하기", done: "제출 완료" };

  }

  function go(next) {
    addTime(timeKey || STEPS[step]);
    step = next; stepStart = Date.now(); timeKey = null;
    render();

  }

          <h2 class="intro-head">잠시 후 같은 앱에<br>다시 접속한 상황입니다.</h2>
          <div class="intro-body">
            <p>이때 아래와 같은 광고 화면이 나타났습니다.</p>
            <p>화면을 확인한 뒤 각 문항에 응답해 주세요.</p>
          </div>` : `
          <h2 class="intro-head">앞서 본 상황과는<br>별개의 상황입니다.</h2>
          <div class="intro-body">
            <p>처음 ‘7일간 보지 않기’를 선택한 뒤,<br><b>잠시 후 같은 앱에 다시 접속했다고 가정</b>해 주세요.</p>
            <p>이때 아래와 같은 광고 화면이 나타났습니다.</p>
            <p>화면을 확인한 뒤 각 문항에 응답해 주세요.</p>
          </div>`}
          <div class="btn-row">
            <button class="btn ghost" type="button" id="iBack">이전</button>
            <button class="btn" type="button" id="iNext">다음</button>
          </div>
        </div>
      </div>`;
    document.getElementById("iBack").onclick = () => go(step - 1);
    if (play) playRejection();
    document.getElementById("iNext").onclick = () => {
      addTime("intro"); timeKey = null;
      S.introSeen[c] = true;
      render();
      window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    };
  }

  // 처음의 거부 장면 재생: ‘7일간 보지 않기’ 박스 → 체크 → ‘닫기’ 박스 → 팝업 닫힘 → 흐려지며 안내 문구
  function playRejection() {
    const stage = document.getElementById("introStage");
    const box = document.getElementById("animBox"), chk = document.getElementById("animCheck"), pop = document.getElementById("animPopup");
    const steps = [
      [350, () => box.classList.add("on")],
      [1050, () => box.classList.add("tap")],
      [1200, () => { box.classList.remove("tap"); chk.hidden = false; }],
      [1900, () => box.classList.add("at-close")],
      [2600, () => box.classList.add("tap")],
      [2750, () => { box.classList.remove("tap", "on"); chk.hidden = true; pop.classList.add("off"); }],
      [3600, () => { stage.classList.remove("playing"); stage.classList.add("settled"); }]
    ];
    steps.forEach(([t, f]) => setTimeout(() => { if (stage.isConnected) f(); }, t));
  }

  function renderCond(c) {
    if (!S.introSeen[c]) return renderIntro(c);
    const ans = S.answers[c];
    app.innerHTML = `
      <div class="cond-head">
        <p class="eyebrow">상황 ${c}</p>
        <h2 class="title">‘7일간 보지 않기’를 선택한 뒤 아래와 같은 광고가 나타났습니다.</h2>
        <p class="lead">화면을 확인하면서 각 문항에 응답해 주세요.</p>
      </div>
      <div class="two-col">
        <div class="sticky">
          <div class="phone"><img src="${IMG[c]}" alt="상황 ${c} 화면" width="402" height="944"></div>
          <button class="zoom-btn" type="button" id="zoomBtn">화면 크게 보기</button>
          <button class="base-btn" type="button" id="baseBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>처음 화면 다시 보기</button>
        </div>
        <div class="stack" style="align-content:start">
          <section class="group" id="item-MC" aria-labelledby="g-${c}-MC">
            <div class="group-head">
              <span class="group-no">질문 1</span>
              <h3 class="group-q" id="g-${c}-MC">현재 보이는 광고는 앞서 ‘7일간 보지 않기’를 표시한 광고와 어떤 점이 다른가요?</h3>
              <p class="muted">해당하는 것을 모두 선택해 주세요. (중복 선택 가능)</p>
            </div>
            <div class="checks" role="group" aria-labelledby="g-${c}-MC">
              ${MC_OPTS.map(([k, t]) => `<button type="button" class="check" role="checkbox" data-mc="${k}" aria-checked="${!!(ans.MC && ans.MC.includes(k))}"><span class="box"></span><span>${t}</span></button>`).join("")}
            </div>
          </section>
          <div class="scale-key"><span>1 = 전혀 그렇지 않다</span><span>7 = 매우 그렇다</span></div>
          <div class="groups">
            ${GROUPS.map(([g, main], gi) => `
            <section class="group" aria-labelledby="g-${c}-${g}">
              <div class="group-head">
                <span class="group-no">질문 ${gi + 2}</span>
                <h3 class="group-q" id="g-${c}-${g}">${main}</h3>
              </div>
              <div class="items">
            ${ITEMS.map(([k, t], i) => [k, t, i]).filter(([k]) => groupOf(k) === g).map(([k, t, i]) => `
              <div class="item" id="item-${k}">
                <p class="q" id="q-${c}-${k}"><b>Q${i + 1}</b>${t}</p>
                <div class="likert" role="radiogroup" aria-labelledby="q-${c}-${k}">
                  ${[1,2,3,4,5,6,7].map(v => `<button type="button" role="radio" id="r-${c}-${k}-${v}" data-k="${k}" data-v="${v}" aria-checked="${ans[k] === v}" aria-label="${v}점">${v}</button>`).join("")}
                </div>
                <div class="ends"><span>전혀 그렇지 않다</span><span>매우 그렇다</span></div>
              </div>`).join("")}
              </div>
            </section>`).join("")}
          </div>
          <p class="err" id="cErr" hidden></p>
          <div class="btn-row">
            <button class="btn ghost" type="button" id="cBack">이전</button>
            <button class="btn" type="button" id="cNext">다음</button>
          </div>
        </div>
      </div>`;
    addFab(true);
    document.getElementById("zoomBtn").onclick = () => openLB(IMG[c], "상황 " + c + " 화면");
    document.getElementById("baseBtn").onclick = () => openLB(IMG.base, "처음 본 광고 팝업 화면");
    app.querySelectorAll("[data-mc]").forEach(b => b.onclick = () => {
      const k = b.dataset.mc;
      const set = new Set(ans.MC || []);
      set.has(k) ? set.delete(k) : set.add(k);
      ans.MC = MC_OPTS.map(([x]) => x).filter(x => set.has(x));
      b.setAttribute("aria-checked", set.has(k));
      document.getElementById("item-MC").classList.remove("missing");
    });

    app.querySelectorAll(".likert button").forEach(b => b.onclick = () => {
      const k = b.dataset.k, v = Number(b.dataset.v);
      ans[k] = v;
      b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", x === b));
      document.getElementById("item-" + k).classList.remove("missing");
    });
    document.getElementById("cBack").onclick = () => go(step - 1);
    document.getElementById("cNext").onclick = () => {
      const missing = (ans.MC && ans.MC.length ? [] : ["MC"]).concat(ITEMS.filter(([k]) => !ans[k]).map(([k]) => k));
      const err = document.getElementById("cErr");
      if (missing.length) {
        missing.forEach(k => document.getElementById("item-" + k).classList.add("missing"));
        err.textContent = `응답하지 않은 문항이 ${missing.length}개 있습니다.`; err.hidden = false;
        document.getElementById("item-" + missing[0]).scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
      go(step + 1);
    };
  }

  // ‘처음 화면 다시 보기’ 버튼 (상황 화면에서는 모바일에서만, 데스크톱은 사진 아래 버튼으로 대체): 처음 본 광고 팝업(기본 이미지)을 크게 보여 줌.
  // 아래쪽 ‘다음/제출하기’ 버튼 줄이 화면에 들어오면 가리지 않도록 숨김
  let fabObs = null;
  function addFab(mobileOnly) {
    document.querySelector(".fab")?.remove();
    if (fabObs) { fabObs.disconnect(); fabObs = null; }
    const fab = document.createElement("button");
    fab.className = "fab" + (mobileOnly ? " fab-mobile" : ""); fab.type = "button"; fab.textContent = "처음 화면 다시 보기";
    fab.onclick = () => openLB(IMG.base, "처음 본 광고 팝업 화면");
    document.body.appendChild(fab);
    const row = app.querySelector(".btn-row");
    if (row && "IntersectionObserver" in window) {
      fabObs = new IntersectionObserver(([e]) => fab.classList.toggle("fab-hide", e.isIntersecting));
      fabObs.observe(row);
    }
  }

  // 마지막 화면: 네 상황을 집단 제시 순서대로 보여 주고, 기대와 가장 다른 상황부터 눌러 1~4 번호를 매김
  function renderRank() {
    const rank = S.rank;
    app.innerHTML = `
      <div class="cond-head">
        <p class="eyebrow">마지막 질문</p>
        <h2 class="title">처음 ‘7일간 보지 않기’를 선택한 이후, 광고가 나타났을 때 가장 거부감이 강했던 순서대로 골라 주세요.</h2>
        <p class="lead">‘7일간 보지 않기’를 누를 때 어떤 광고가 안 보이길 바랐는지 떠올려 보세요.<br>아래 네 가지 상황 중, 그 기대와 가장 다른 상황을 1번에, 가장 가까운 상황을 4번에 놓아 주세요.</p>
        <p class="rank-scale">1. 기대와 가장 다름 → 4. 기대와 가장 가까움</p>
      </div>
      <div class="rank-slots" aria-label="선택한 순서">
        ${ORDER.map((_, i) => {
          const c = rank[i];
          return (i ? `<span class="slot-arrow" aria-hidden="true">→</span>` : "") +
            (c ? `<button type="button" class="slot filled" data-s="${c}" aria-label="${i + 1}번째 ${c}, 눌러서 취소">${c}</button>`
               : `<span class="slot" aria-label="${i + 1}번째 비어 있음">${i + 1}</span>`);
        }).join("")}
      </div>
      <p class="muted rank-help">화면을 누르면 위 칸이 순서대로 채워집니다. 다시 누르면 취소됩니다.</p>
      <div class="stack">
        <div class="rank-grid">
          ${ORDER.map(c => {
            const n = rank.indexOf(c) + 1;
            return `
            <div class="rank-item">
              <button type="button" class="rank-card" data-c="${c}" aria-pressed="${n > 0}" aria-label="상황 ${c}${n ? ", " + n + "번째" : ""}">
                <div class="phone"><img src="${IMG[c]}" alt="" width="402" height="944"></div>
                ${n ? `<span class="rank-badge" aria-hidden="true">${n}</span>` : ""}
              </button>
              <p class="rank-name">${c}</p>
              <button type="button" class="rank-zoom" data-z="${c}">크게 보기</button>
            </div>`;
          }).join("")}
        </div>
        <p class="err" id="rErr" hidden>네 화면 모두 순서를 정해 주세요.</p>
        <div class="btn-row">
          <button class="btn ghost" type="button" id="rBack">이전</button>
          ${rank.length ? `<button class="btn ghost" type="button" id="rReset">다시 고르기</button>` : ""}
          <button class="btn" type="button" id="rNext" ${rank.length === ORDER.length ? "" : "disabled"}>제출하기</button>
        </div>
      </div>`;
    const toggle = c => {
      const i = rank.indexOf(c);
      if (i >= 0) rank.splice(i, 1); else rank.push(c);
      renderRank();
      app.querySelector(`[data-c="${c}"]`).focus({ preventScroll: true });
    };
    app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => toggle(b.dataset.c));
    app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => toggle(b.dataset.s));
    addFab();
    app.querySelectorAll("[data-z]").forEach(b => b.onclick = () => openLB(IMG[b.dataset.z], "상황 " + b.dataset.z + " 화면"));
    document.getElementById("rBack").onclick = () => go(step - 1);
    const rs = document.getElementById("rReset");
    if (rs) rs.onclick = () => { rank.length = 0; renderRank(); };
    document.getElementById("rNext").onclick = () => {
      if (rank.length !== ORDER.length) { document.getElementById("rErr").hidden = false; return; }
      submit();
    };
  }

  let saveResult = null;

  // 구글 시트(Apps Script)로 한 명당 한 줄 전송. 응답을 확인하고, 실패하면 최대 3번까지 다시 시도
  async function sendToSheet(record) {
    const body = JSON.stringify(flatten(record));
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const res = await fetch(SUBMIT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body });
        const out = await res.json().catch(() => null);
        if (out && out.ok) return true;
      } catch (e) {}
      await new Promise(r => setTimeout(r, 1200 * (attempt + 1)));
    }
    return false;
  }
  async function submit() {
    addTime(STEPS[step]);
    S.submittedAt = new Date().toISOString();
    S.order = ORDER.join("");
    S.group = GROUP;
    S.ver = "v3"; // v3: rank 1 = 기대와 가장 다름 / 광고 대응 방식·상황별 차이 문항 추가
    const record = JSON.parse(JSON.stringify(S));
    saveResult = { local: localAdd(record), remote: "pending" };
    step = STEPS.length - 1; stepStart = Date.now();
    render();
    if (SUBMIT_URL) {
      saveResult.remote = (await sendToSheet(record)) ? "ok" : "fail";
      saveResult.record = record;
      return renderDone();
    }
    const db = await getDb();
    if (!db) { saveResult.remote = "none"; return renderDone(); }
    try {
      // 각 참가자 계정은 responses/<본인 id> 문서에만 쓸 수 있고, 연구자(편집자)만 전체를 읽음
      const user = await window.claude.use("user").catch(() => null);
      const uid = user ? await user.id() : null;
      if (!uid) throw { code: "no_user" };
      const ref = db.doc("responses/" + uid);
      const cur = await ref.get();
      const items = Object.assign({}, (cur.exists && cur.data() && cur.data().items) || {});
      items[record.id] = record;
      await ref.set({ items, updatedAt: record.submittedAt });
      saveResult.remote = "ok";
    } catch (e) {
      saveResult.remote = "fail"; saveResult.err = (e && e.code) || "error";
    }
    renderDone();
  }

  function renderDone() {
    setProgress();
    document.querySelector(".fab")?.remove();
    const r = saveResult || {};
    if (r.remote === "pending") {
      app.innerHTML = `<div class="narrow stack"><div><h1 class="title">응답을 제출하는 중입니다…</h1><p class="lead">잠시만 기다려 주세요. 창을 닫지 마세요.</p></div></div>`;
      return;
    }
    const failed = r.remote === "fail" || r.remote === "none";
    app.innerHTML = failed ? `
      <div class="narrow stack">
        <div>
          <h1 class="title">응답이 아직 저장되지 않았습니다.</h1>
          <p class="lead">인터넷 연결을 확인한 뒤 아래 버튼을 눌러 다시 제출해 주세요. 응답한 내용은 그대로 남아 있습니다.</p>
        </div>
        ${SUBMIT_URL ? `<div class="btn-row" style="justify-content:flex-start;margin-top:0"><button class="btn" type="button" id="resend">다시 제출하기</button></div>` : ""}
        <p class="muted">계속 저장되지 않으면 이 화면을 캡처해 연구자에게 보내 주세요. (응답 번호 ${esc(S.id)})</p>
      </div>` : `
      <div class="narrow stack">
        <div>
          <h1 class="title">응답해 주셔서 감사합니다.</h1>
          <p class="lead">모든 문항에 대한 응답이 제출되었습니다.</p>
        </div>
      </div>`;
    const rs = document.getElementById("resend");
    if (rs) rs.onclick = async () => {
      rs.disabled = true; rs.textContent = "제출하는 중…";
      saveResult.remote = (await sendToSheet(saveResult.record)) ? "ok" : "fail";
      renderDone();
    };
  }

  function copyText(text, btn, fallbackEl) {
    const done = () => { btn.textContent = "복사됨"; setTimeout(() => btn.textContent = "데이터 복사", 1500); };
    try {
      navigator.clipboard.writeText(text).then(done, () => selectEl(fallbackEl));
    } catch { selectEl(fallbackEl); }
  }
  function selectEl(el) { if (!el) return; const rng = document.createRange(); rng.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(rng); }

  // ---------- 확대 보기 ----------
  const lb = document.getElementById("lightbox");
  function openLB(src, alt) { document.getElementById("lbImg").src = src; document.getElementById("lbImg").alt = alt; lb.hidden = false; document.getElementById("lbClose").focus(); }
  function closeLB() { lb.hidden = true; }
  document.getElementById("lbClose").onclick = closeLB;
  lb.onclick = e => { if (e.target === lb) closeLB(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !lb.hidden) closeLB(); });

  // ---------- 연구자용 결과 화면 (#results) ----------
  async function renderResults() {
    document.getElementById("stepLabel").textContent = "연구자 · 응답 결과";
    document.getElementById("stepNo").textContent = "";
    document.getElementById("bar").style.width = "100%";
    app.innerHTML = `<div class="stack"><div><p class="eyebrow">연구자 전용</p><h1 class="title">응답 결과</h1></div><p class="muted" id="resStatus">불러오는 중…</p><div id="resBody"></div></div>`;
    const status = document.getElementById("resStatus");
    let rows = [], src = [];
    const db = await getDb();
    if (db) {
      try {
        const snap = await db.collection("responses").get();
        const docs = snap.docs || [];
        rows = docs.flatMap(d => { const v = d.data(); return v && v.items ? Object.values(v.items) : []; });
        src.push("데이터베이스 " + rows.length + "건");
      } catch (e) { src.push("데이터베이스를 읽을 수 없음 (" + ((e && e.code) || "error") + ")"); }
    } else src.push("데이터베이스 사용 불가");
    const ids = new Set(rows.map(r => r.id));
    const loc = localAll().filter(r => !ids.has(r.id));
    rows = rows.concat(loc);
    src.push("이 기기에만 저장된 응답 " + loc.length + "건");
    rows.sort((a, b) => String(a.submittedAt).localeCompare(String(b.submittedAt)));
    status.textContent = `총 ${rows.length}건 · ` + src.join(" · ");
    if (!rows.length) { document.getElementById("resBody").innerHTML = `<div class="panel muted">아직 제출된 응답이 없습니다. 참가자가 마지막 화면에서 제출하면 여기에 나타납니다.</div>`; return; }
    const flat = rows.map(flatten);
    const cols = Object.keys(flat[0]);
    const csv = toCSV(rows);
    document.getElementById("resBody").innerHTML = `
      <div class="btn-row" style="justify-content:flex-start;margin:0 0 12px"><button class="btn" type="button" id="dlCsv">CSV 저장</button><button class="btn ghost" type="button" id="cpCsv">CSV 복사</button></div>
      <div class="table-wrap"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${flat.map(f => `<tr>${cols.map(c => `<td>${esc(f[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <pre class="code" id="csvText" hidden></pre>`;
    const fname = "ad_reexposure_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.getElementById("dlCsv").onclick = async () => {
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
      if (dl) { try { await dl.save({ filename: fname, data: new Blob([csv], { type: "text/csv" }) }); } catch {} return; }
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = fname; a.click();
    };
    const cpb = document.getElementById("cpCsv");
    cpb.onclick = () => { const pre = document.getElementById("csvText"); pre.textContent = csv; pre.hidden = false; copyText(csv, cpb, pre); };
  }

  function route() { if (location.hash === "#results") renderResults(); else render(); }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
